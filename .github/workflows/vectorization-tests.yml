name: Vectorization tests

on:
  push:
    branches: [main, feat/vector-search-local-first]
    paths:
      - 'filter/embedding_service.py'
      - 'filter/vector_storage.py'
      - 'filter/requirements-vectorization.txt'
      - 'tests/**'
      - '.github/workflows/vectorization-tests.yml'
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx psycopg[binary] psycopg-pool
      - name: Run provider and storage unit tests
        run: pytest tests/test_embedding_service.py tests/test_vector_storage.py -v

  pgvector-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL driver
        run: pip install psycopg[binary] psycopg-pool
      - name: Verify pgvector initialization and cosine search
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['TEST_DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute('CREATE EXTENSION IF NOT EXISTS vector')
                  cur.execute('CREATE TABLE memory_vectors (id int primary key, embedding vector(3))')
                  cur.execute("INSERT INTO memory_vectors VALUES (1, '[1,0,0]'), (2, '[0,1,0]')")
                  cur.execute("SELECT id FROM memory_vectors ORDER BY embedding <=> '[1,0,0]'::vector LIMIT 1")
                  assert cur.fetchone()[0] == 1
              conn.commit()
          PY
