# User Memory filter database: PostgreSQL 16 with the pgvector extension.
# Replaces docker-compose.langgraph.yml (plain postgres:16-alpine).
#
# The filter reaches this database at the host's LAN IP on the published
# port (filter valves postgres_host=<host ip>, postgres_port=5432), so the
# same valves work whether Open WebUI runs on this machine or another one.
# The container also sits on webui-network, so the container name works too.
#
# Data lives on a bind mount, one root per stack: ~/docker-data/langgraph/.
# Migration from the old container: pg_dump from langgraph-postgres, restore
# here, then CREATE EXTENSION vector. The old named volume is left untouched.

services:
  langgraph-pgvector:
    image: pgvector/pgvector:pg16
    container_name: langgraph-pgvector
    restart: unless-stopped

    environment:
      POSTGRES_DB: langgraph_memory
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: langgraph_password_change_me # CHANGE THIS IN PRODUCTION!
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - /Users/beaudamore/docker-data/langgraph/postgres:/var/lib/postgresql/data

    # Same host port the old langgraph-postgres container used, so the filter
    # valves stay unchanged. Stop the old container before starting this one.
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph_memory"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - webui-network

networks:
  webui-network:
    external: true
